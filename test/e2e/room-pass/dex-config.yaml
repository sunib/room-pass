# Dex for the fixture: deploy/example/dex-config.yaml with this environment's
# issuer and a public PKCE client for the demo client and the device flow.
issuer: https://login.room-pass.test:18443
# In Kubernetes, as dex.coreos.com resources in Dex's namespace: signing keys
# and logins in progress survive a Dex restart, with no volume to back up.
# `check`: Dex does not create its CRDs (it has no right to); apply
# deploy/dex-crds first. deploy/dex/rbac.yaml grants what this needs.
storage:
  type: kubernetes
  config:
    inCluster: true
    crdHandling: check
web:
  http: 0.0.0.0:5556
expiry:
  idTokens: 5m
oauth2:
  skipApprovalScreen: true
staticClients:
  - id: room-pass-demo
    name: Room Pass demo
    public: true
    redirectURIs:
      - https://demo.room-pass.test:18443/app/callback
      - /device/callback
connectors:
  - type: authproxy
    id: room-pass
    name: Join the room
    config:
      userIDHeader: X-Remote-User-Id
      userHeader: X-Remote-User
      userNameHeader: X-Remote-User-Name
      emailHeader: X-Remote-User-Email
      groupHeader: X-Remote-Group
