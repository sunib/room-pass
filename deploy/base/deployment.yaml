apiVersion: apps/v1
kind: Deployment
metadata:
  name: room-pass
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: room-pass
  template:
    metadata:
      labels:
        app: room-pass
    spec:
      serviceAccountName: room-pass
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: room-pass
          image: room-pass:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
            - name: metrics
              containerPort: 9090
          env:
            - name: ROOM_NAME
              value: demo
            - name: ROOM_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DEX_UPSTREAM
              value: http://dex:5556
            # JOIN_ORIGIN, ISSUER_ORIGIN and ALLOWED_RETURN_URLS are required and
            # belong to the environment, so the base sets none of them: an overlay
            # adds all three with a strategic-merge patch (env merges by name), and
            # Room Pass refuses to start while one is missing. ALLOWED_RETURN_URLS is
            # the platform half of a pair: a Room may only name a return URL that
            # already appears here -- Ready() refuses otherwise -- so it cannot be
            # widened from a Room. test/e2e/room-pass is a working overlay.
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 64Mi
            limits:
              cpu: '1'
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
