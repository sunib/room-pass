# One replica, no disk. Dex keeps its state in Kubernetes (dex-config.yaml):
# signing keys, pending logins and codes are dex.coreos.com resources in this
# namespace, written through the ServiceAccount in rbac.yaml. So a Dex restart
# keeps its keys, ID tokens issued before it go on verifying, and a login in
# progress finishes on the new pod.
#
# The CRDs come from deploy/dex-crds, applied first. Dex does not create them:
# its config says `crdHandling: check`, and it has no right to.
#
# One replica, and Recreate. Two pods sharing this storage would be safe, but
# the storage type is the overlay's choice: with `type: memory`, two pods are
# two issuers with different keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      serviceAccountName: dex
      # The token is Dex's credential for its storage, and only that: the Role
      # in rbac.yaml reaches nothing but dex.coreos.com in this namespace.
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        # The dex user in ghcr.io/dexidp/dex.
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          args: [dex, serve, /etc/dex/config.yaml]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            # The image's entrypoint renders the config into /tmp before
            # starting Dex; the root filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: http
      volumes:
        - name: config
          configMap:
            name: dex
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
