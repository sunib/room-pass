# One replica, no disk. Dex keeps its state in memory (dex-config.yaml), and
# for Room Pass that state is disposable: the participant's identity lives in
# Room Pass's Participants and cookie, the subject is computed rather than
# stored, and the authproxy connector issues no refresh tokens.
#
# What a restart costs: new signing keys, so ID tokens issued before it no
# longer verify, and logins in progress start over. An application whose token
# stops verifying (or that gets 401 from Kubernetes) sends the participant back
# to sign in, and Room Pass recognises the enrolled browser: one tap, same
# identity.
#
# Exactly one replica, and Recreate: two Dex pods with in-memory storage are two
# issuers with different keys, so a login that starts on one cannot finish on
# the other, and a token one signs does not verify against the other's keys.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: dex
  template:
    metadata:
      labels:
        app: dex
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        # The dex user in ghcr.io/dexidp/dex.
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: dex
          image: ghcr.io/dexidp/dex:v2.45.1
          args: [dex, serve, /etc/dex/config.yaml]
          ports:
            - name: http
              containerPort: 5556
          volumeMounts:
            - name: config
              mountPath: /etc/dex
              readOnly: true
            # The image's entrypoint renders the config into /tmp before
            # starting Dex; the root filesystem stays read-only.
            - name: tmp
              mountPath: /tmp
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /.well-known/openid-configuration
              port: http
      volumes:
        - name: config
          configMap:
            name: dex
        - name: tmp
          emptyDir:
            sizeLimit: 16Mi
