# One event. Apply after the CRDs are Established; Room Pass serves the Room
# named by ROOM_NAME (deploy/base: demo) in its own namespace.
#
# Decide joinCode, audienceGroup and allowedReturnURLs before the event: they
# cannot be changed afterwards. Changing them means deleting and recreating the
# Room, which deletes its Participants and signs every browser out.
apiVersion: room-pass.koudijs.dev/v1alpha1
kind: Room
metadata:
  name: demo
  namespace: room-pass
spec:
  title: My talk
  # Shown on the join page: what the application does with the name.
  attributionNote: Your name labels the changes you make during the session.
  # Optional: dress the join page for this talk. Pictures are paths your
  # application serves on its own host, without a login. Editing this starts a
  # fresh join code, so set it before the event.
  # appearance:
  #   tagline: My conference · Room B · Thursday 14:30
  #   picture: /talks/my-talk/logo.png
  #   pictureAlt: My conference
  #   accentColor: "#f2a541"
  #   backgroundColor: "#0f3d3e"
  #   backgroundImage: /talks/my-talk/stage.jpg
  # Optional: one question everyone answers when joining. The answer's group
  # joins audienceGroup in their token. Participants choose it, so it carries
  # no more weight than their name. Set it before the event too.
  # question:
  #   prompt: Your favourite frontend framework?
  #   answers:
  #     - label: React
  #       group: demo:framework-react
  #     - label: Svelte
  #       group: demo:framework-svelte
  # Optional: groups naming the browser and platform each participant joined
  # with, such as demo:browser-safari and demo:platform-ios. Only what the
  # browser claims to be.
  # browserGroups:
  #   prefix: "demo:"
  # Nobody can join after this. Move it before every event.
  endsAt: "2026-12-31T18:00:00Z"
  enrollment: Open
  maxParticipants: 300
  # Every participant's group. Bind your application's permissions to it.
  audienceGroup: demo:my-talk
  # Must also appear in ALLOWED_RETURN_URLS.
  allowedReturnURLs:
    - https://app.example.com/
  # validFor may be at most four rotations.
  joinCode:
    rotateEvery: 30s
    validFor: 120s
    length: 6
