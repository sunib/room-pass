# Dex reads client secrets from its environment (secretEnv in dex-config.yaml).
# Create the Secret before Dex starts:
#
#   kubectl -n room-pass create secret generic dex-clients \
#     --from-literal=MY_APP_CLIENT_SECRET="$(openssl rand -hex 32)"
#
# and give the application the same value. Dex reads it only when its pod
# starts: after changing the Secret, restart Dex.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dex
spec:
  template:
    spec:
      containers:
        - name: dex
          envFrom:
            - secretRef:
                name: dex-clients
