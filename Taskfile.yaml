# Task vocabulary for Room Pass, and the CI contract.
#
# The GitHub workflow in .github/workflows/ci.yml does not know how to lint or
# test anything: it builds the container from .devcontainer/Dockerfile and runs
# these tasks inside it. So every check CI performs is reproducible with the
# identical command locally.
version: '3'

vars:
  # Publishing target. Overridable so the same tasks can push to a local k3d
  # registry or another registry.
  REGISTRY: '{{.REGISTRY | default "ghcr.io"}}'
  IMAGE_OWNER: '{{.IMAGE_OWNER | default "sunib"}}'
  # Add linux/arm64 here when something actually needs to run on it --
  # multi-arch doubles every build.
  PLATFORMS: '{{.PLATFORMS | default "linux/amd64"}}'

tasks:
  default:
    desc: List the available tasks
    silent: true
    cmds:
      - task --list

  ci:
    desc: Everything CI checks, in the order it checks it
    # .github/workflows/ci.yml builds the ci stage of .devcontainer/Dockerfile and
    # runs exactly this inside it. A red CI run reproduces with `task ci` in the
    # devcontainer. It creates two disposable k3d clusters on the Docker daemon
    # it can reach, one after the other, and deletes both.
    cmds:
      - task: lint
      - task: test
      - task: verify-generate
      - task: integration
      - task: test-network
      - defer: { task: e2e-down }
      - task: e2e-up
      - task: browser

  deps:
    desc: Download Go module dependencies
    sources:
      - go.mod
      - go.sum
    cmds:
      - go mod download

  generate:
    desc: Regenerate CRDs and deepcopy implementations
    cmds:
      - controller-gen object paths=./api/...
      - controller-gen crd paths=./api/... output:crd:artifacts:config=config/crd

  verify-generate:
    desc: Fail if the committed CRDs and deepcopy code are stale
    # CI runs this so a change to api/v1alpha1 that was never regenerated shows up
    # in review, rather than as a controller that silently rejects a field the CRD
    # does not know about. Fix a failure with `task generate` and commit.
    cmds:
      - task: generate
      - |
        if ! git diff --quiet -- api config/crd; then
          echo "::error::Generated files are stale. Run 'task generate' and commit the result." >&2
          git --no-pager diff -- api config/crd
          exit 1
        fi
        echo "generated files are current"

  lint:
    desc: Run every linter (Go, Dockerfiles, workflows)
    cmds:
      - task: lint-golang
      - task: lint-dockerfiles
      - task: lint-actions

  lint-golang:
    desc: Lint with golangci-lint (config in .golangci.yml)
    cmds:
      - golangci-lint run ./...

  lint-dockerfiles:
    desc: Lint every Dockerfile with hadolint (config in .hadolint.yaml)
    cmds:
      - hadolint .devcontainer/Dockerfile Dockerfile test/e2e/demo-client/Dockerfile

  lint-actions:
    desc: Lint the GitHub Actions workflows with actionlint
    # No path argument: actionlint discovers everything under .github/workflows.
    cmds:
      - actionlint

  lint-fix:
    desc: Apply golangci-lint's automatic fixes
    cmds:
      - golangci-lint run --fix ./...

  test:
    desc: Run Go vet and race tests
    cmds:
      - go vet ./...
      - go test -race ./...

  integration:
    desc: Test CRDs against a real local API server and etcd
    # Needs an API server and etcd binary. The CI image ships them at
    # ENVTEST_K8S_VERSION and points KUBEBUILDER_ASSETS at them; anywhere else,
    # setup-envtest fetches that same version on first use.
    vars:
      ENVTEST_K8S_VERSION: '{{.ENVTEST_K8S_VERSION | default "1.31.0"}}'
    cmds:
      - KUBEBUILDER_ASSETS="${KUBEBUILDER_ASSETS:-$(setup-envtest use {{.ENVTEST_K8S_VERSION}} -p path)}" go test -count=1 ./test/integration

  build:
    desc: Build the room-pass binary into bin/
    cmds:
      - mkdir -p bin
      - go build -o ./bin/room-pass ./cmd/room-pass

  present:
    desc: Show the presenter's QR code, following the Room's rotating join code
    # The join code is operator-only credential material, so this runs under
    # YOUR kubeconfig and inherits the answer Kubernetes already gives: no
    # access to rooms/status, no QR code. That is also why it is a terminal
    # tool rather than a page in the application, which would need an operator
    # login of its own.
    #
    # BASE is the application's origin and has no default: it is the one thing
    # this tool cannot guess, and guessing it would print a QR code that quietly
    # sends the room somewhere else.
    #
    #   task present BASE=https://app.example.com NEXT=/answer/round-1
    vars:
      BASE: '{{.BASE}}'
      NEXT: '{{.NEXT | default "/"}}'
      ROOM: '{{.ROOM | default "demo"}}'
      ROOM_NAMESPACE: '{{.ROOM_NAMESPACE | default "room-pass"}}'
      LOGIN_PATH: '{{.LOGIN_PATH | default "/auth/login"}}'
    cmds:
      - go run ./cmd/room-qr --base {{.BASE}} --next {{.NEXT}} --room {{.ROOM}} --namespace {{.ROOM_NAMESPACE}} --login-path {{.LOGIN_PATH}}

  image:
    desc: Build the Room Pass image (ghcr.io/sunib/room-pass)
    # CI calls exactly this task with PUSH=true, so a local build and the
    # published image are produced by the same command with the same build args.
    #
    #   task image                          # build, load into local docker
    #   task image TAG=test PUSH=true       # build and push
    vars:
      TAG: '{{.TAG | default "dev"}}'
      PUSH: '{{.PUSH | default "false"}}'
      IMAGE: '{{.REGISTRY}}/{{.IMAGE_OWNER}}/room-pass'
      # EXTRA_TAGS: newline- or space-separated additional full image refs.
      EXTRA_TAGS: '{{.EXTRA_TAGS | default ""}}'
      # METADATA_FILE: buildx writes the pushed digest here, for CI to report.
      METADATA_FILE: '{{.METADATA_FILE | default ""}}'
    cmds:
      - |
        set -euo pipefail
        GIT_COMMIT="$(git rev-parse --short HEAD 2>/dev/null || echo unknown)"
        BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

        args=(
          --platform "{{.PLATFORMS}}"
          --build-arg "VERSION={{.TAG}}"
          --build-arg "GIT_COMMIT=${GIT_COMMIT}"
          --build-arg "BUILD_DATE=${BUILD_DATE}"
          --label "org.opencontainers.image.source=https://github.com/sunib/room-pass"
          --label "org.opencontainers.image.revision=$(git rev-parse HEAD 2>/dev/null || echo unknown)"
          --label "org.opencontainers.image.created=${BUILD_DATE}"
          --tag "{{.IMAGE}}:{{.TAG}}"
        )
        for extra in {{.EXTRA_TAGS}}; do args+=(--tag "${extra}"); done
        {{if .METADATA_FILE}}args+=(--metadata-file "{{.METADATA_FILE}}"){{end}}
        {{if eq .PUSH "true"}}
        args+=(--push)
        {{else}}
        # --load only accepts a single platform.
        case "{{.PLATFORMS}}" in *,*) : ;; *) args+=(--load) ;; esac
        {{end}}

        echo "Building {{.IMAGE}}:{{.TAG}} ({{.PLATFORMS}})"
        docker buildx build "${args[@]}" .

  ci-image:
    desc: Build the CI stage of the devcontainer image (what CI runs tasks inside)
    vars:
      CI_IMAGE: '{{.CI_IMAGE | default "room-pass-ci:local"}}'
    cmds:
      - docker build --target ci -f .devcontainer/Dockerfile -t {{.CI_IMAGE}} .

  clean:
    desc: Remove build output and task fingerprints
    cmds:
      - rm -rf .task bin

  e2e-up:
    desc: Build and start the isolated Room Pass OIDC demo cluster
    cmds:
      - bash test/e2e/up.sh

  e2e-down:
    desc: Delete only the Room Pass demo cluster and its Docker resources
    cmds:
      - bash test/e2e/down.sh

  e2e:
    desc: Verify real Dex, device flow, RBAC, audit and the interactive demo
    cmds:
      - ROOM_PASS_E2E=1 ROOM_PASS_EDGE_IP="$(docker network inspect k3d-room-pass-e2e --format '{{"{{"}}(index .IPAM.Config 0).Gateway{{"}}"}}')" go test -v -count=1 ./test/e2e

  load:
    desc: Rehearse 300 enrollments in batches of 100, then clean up test participants
    cmds:
      - ROOM_PASS_LOAD=1 ROOM_PASS_EDGE_IP="$(docker network inspect k3d-room-pass-e2e --format '{{"{{"}}(index .IPAM.Config 0).Gateway{{"}}"}}')" go test -v -count=1 -run TestSharedNATEnrollment ./test/e2e

  test-network:
    desc: Test Dex NetworkPolicy with real pods in a disposable k3d cluster
    cmds:
      - bash test/network/run.sh

  browser:
    desc: Run Chromium room-login tests against the local e2e fixture
    dir: test/browser
    # The CI image ships Chromium for the Playwright version package-lock.json
    # resolves and sets PLAYWRIGHT_BROWSERS_PATH. Outside it, Playwright installs
    # the browser and its system libraries first (which may use sudo).
    cmds:
      - npm ci --no-audit --no-fund
      - '[ -n "${PLAYWRIGHT_BROWSERS_PATH:-}" ] || npx playwright install --with-deps chromium'
      - npm test
