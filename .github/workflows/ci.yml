# One job, one container, one command.
#
# This file knows how to build the CI container and where to run it, and nothing
# about what is checked. Every check is `task ci`, run inside the ci stage of
# .devcontainer/Dockerfile -- the image the devcontainer is built from -- so a
# red run reproduces with `task ci` in the devcontainer, with the same tools at
# the same versions. Nothing is installed on the runner.
#
# The only actions used are checkout and upload-artifact. Building and pushing
# images is the Docker CLI the runner already has, so no buildx, login or
# build-push action is needed.
#
# Trust model: pull request code is built and tested but never meets a write
# token. Only a push to main publishes, and it publishes two images: the CI
# container (so the next run reuses its layers) and Room Pass itself, tagged
# sha-<short> and main. release.yml retags that exact digest with a version.
name: CI

on:
  # Not filtered to main: a stacked pull request against another topic branch
  # would otherwise merge with nothing having run against it.
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI_IMAGE: ghcr.io/sunib/room-pass-ci
  # Only a push to main publishes. Not `!= 'pull_request'`, which would also let
  # a workflow_dispatch on any branch publish.
  PUBLISH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  ci:
    name: task ci
    runs-on: ubuntu-latest
    # Most of this is a cold k3d cluster with Dex and Traefik coming up twice.
    timeout-minutes: 60
    permissions:
      contents: read
      # Read the CI container cache on every run; write it only from main. A fork
      # pull request gets a read-only token whatever is declared here.
      packages: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build the CI container
        # Layers come from the last image main published, when it can be read.
        # A cache miss is only slower, never a failure.
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "${TOKEN}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin || true
          docker buildx build \
            --target ci \
            --file .devcontainer/Dockerfile \
            --cache-from "${CI_IMAGE}:main" \
            --build-arg BUILDKIT_INLINE_CACHE=1 \
            --tag room-pass-ci \
            --load \
            .

      - name: task ci
        # The Docker socket is mounted because the e2e and network suites start
        # k3d clusters on the runner's daemon, as the devcontainer does on yours.
        run: |
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspaces/room-pass" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -w /workspaces/room-pass \
            room-pass-ci \
            bash -lc 'git config --global --add safe.directory "$PWD" && task ci'

      - name: Keep browser recordings and failure traces
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: browser-results
          path: |
            test/browser/test-results/
            test/browser/playwright-report/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build the dev container
        # Never pushed. Proves a fresh clone can still open the devcontainer, which
        # is otherwise discovered by whoever's rebuild fails first. It is FROM ci,
        # so this only adds the editor tools.
        run: docker buildx build --target dev --file .devcontainer/Dockerfile --tag room-pass-dev .

      - name: Publish the CI container and the Room Pass image
        if: env.PUBLISH == 'true'
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker tag room-pass-ci "${CI_IMAGE}:main"
          docker push "${CI_IMAGE}:main"
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/workspaces/room-pass" \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "${RUNNER_TEMP}:/out" \
            -w /workspaces/room-pass \
            -e TOKEN -e GITHUB_SHA -e ACTOR="${{ github.actor }}" \
            room-pass-ci \
            bash -lc '
              set -e
              git config --global --add safe.directory "$PWD"
              echo "${TOKEN}" | docker login ghcr.io -u "${ACTOR}" --password-stdin
              task image PUSH=true TAG="sha-${GITHUB_SHA:0:7}" \
                EXTRA_TAGS="ghcr.io/sunib/room-pass:main" \
                METADATA_FILE=/out/image-metadata.json
            '
          DIGEST="$(jq -r '."containerimage.digest"' "${RUNNER_TEMP}/image-metadata.json")"
          {
            echo "### room-pass"
            echo
            echo '```text'
            echo "ghcr.io/sunib/room-pass@${DIGEST}"
            echo '```'
            echo
            echo "Also tagged \`sha-${GITHUB_SHA:0:7}\` and \`main\`."
          } >> "$GITHUB_STEP_SUMMARY"
