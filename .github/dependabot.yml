# Everything here is pinned: action SHAs, the golang base image digest, tool
# versions in .devcontainer/Dockerfile's ENV block. Dependabot keeps them moving.
#
# One pull request a week for all of it. Every ecosystem below joins the same
# multi-ecosystem group, so Go modules, the Playwright package, the workflow
# actions and both base images arrive together and pass CI together -- a Go
# module that needs a newer toolchain lands in the same PR as the image that
# provides it, instead of failing on its own.
version: 2

multi-ecosystem-groups:
  dependencies:
    schedule:
      interval: "weekly"

updates:
  - package-ecosystem: "gomod"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
    ignore:
      # k8s.io/api moves in lockstep with k8s.io/client-go, and Go's version
      # selection raises it whenever client-go moves. Updated on its own it
      # cannot build against the older client-go, which made every Go modules
      # run end red while the group update itself went through.
      - dependency-name: "k8s.io/api"

  - package-ecosystem: "npm"
    directory: "/test/browser"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "github-actions"
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"

  - package-ecosystem: "docker"
    directories:
      - "/"
      - "/.devcontainer"
    patterns: ["*"]
    multi-ecosystem-group: "dependencies"
